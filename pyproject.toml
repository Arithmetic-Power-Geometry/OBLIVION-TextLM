[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oblivion-textlm"
version = "2.0.0"
description = "Proprietary query-relative TextLM system implementing OBLIVION over a separately licensed pretrained LLM executor."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
license = {text = "Proprietary"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "prometheus-client>=0.20,<1"
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.39,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2"
]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1"
]

[project.urls]
Repository = "https://github.com/Arithmetic-Power-Geometry/OBLIVION-TextLM"
"OBLIVION paper" = "https://doi.org/10.5281/zenodo.22172608"

[project.scripts]
oblivion-textlm = "oblivion_textlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
